<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nasaf Digital · Devor ekrani</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: #EEF0F3; font-family: Sora, system-ui, sans-serif; overflow: hidden; }
  a { color: #2f7ab9; text-decoration: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  @keyframes tick { from { width: 0%; } to { width: 100%; } }
  .nshop-row:not(:last-child) { border-bottom: 1px solid rgba(15,23,42,.07); }
  .feed-row { border-top: 1px solid rgba(255,255,255,.1); }

  /* ── Login ── */
  #login-screen {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    width: 380px; max-width: 90vw; background: #fff; border-radius: 20px; padding: 36px 32px;
    border: 1px solid rgba(15,23,42,.09); box-shadow: 0 20px 50px rgba(15,23,42,.08);
    box-sizing: border-box;
  }
  #login-screen { padding: 16px; box-sizing: border-box; }
  .login-logo {
    width: 52px; height: 52px; border-radius: 14px; background: #2f7ab9; color: #fff;
    display: flex; align-items: center; justify-content: center; font: 600 18px Sora, sans-serif;
    margin-bottom: 18px;
  }
  .login-title { font: 600 22px Sora, sans-serif; color: #0f172a; letter-spacing: -.02em; }
  .login-sub { font: 400 15px Sora, sans-serif; color: #6B7280; margin-top: 6px; margin-bottom: 24px; }
  .login-label { font: 500 13px Sora, sans-serif; color: #374151; display: block; margin-bottom: 7px; }
  .login-input {
    width: 100%; height: 46px; border-radius: 11px; border: 1px solid rgba(15,23,42,.15);
    padding: 0 14px; font: 500 17px Sora, sans-serif; color: #0f172a; letter-spacing: .02em;
    outline: none; background: #FAFBFC;
  }
  .login-input:focus { border-color: #2f7ab9; background: #fff; }
  .login-btn {
    width: 100%; height: 46px; border-radius: 11px; border: none; background: #2f7ab9; color: #fff;
    font: 600 16px Sora, sans-serif; cursor: pointer; margin-top: 18px;
  }
  .login-btn:disabled { opacity: .55; cursor: default; }
  .login-btn.secondary { background: none; color: #2f7ab9; font-weight: 500; height: 36px; margin-top: 10px; }
  .login-error { color: #dc2626; font: 500 14px Sora, sans-serif; margin-top: 12px; min-height: 18px; }
  .login-hint { color: #9AA1AC; font: 400 13px Sora, sans-serif; margin-top: 14px; text-align: center; }

  /* ── Dashboard (design'dan) ── */
  #dashboard-screen { display: none; height: 100vh; position: relative; }
  .act-lvl-ahead { background: #16a34a; }
  .act-lvl-onTrack { background: #2f7ab9; }
  .act-lvl-behind { background: #d97706; }
  .act-lvl-debt { background: #dc2626; }

  /* ── Moslashuvchan (responsive) ekran ──
     Dizayn asli 1920x1080 devor monitori uchun aniq piksellarda
     qurilgan. Kengroq/torroq ekranlar (turli monitor/noutbuk
     o'lchamlari, planshet gorizontal) uchun butun "kanvas" JS orqali
     ekran o'lchamiga moslab kichraytirilib/kattalashtiriladi (transform:
     scale) — shu bilan aniq dizayn hech qanday o'zgarishsiz saqlanadi.
     Juda tor ekranlarda (telefon, ~880px dan kichik) kichraytirish
     matnni o'qib bo'lmas darajada mayda qilib yuborardi — shu sababli
     o'sha holatda kichraytirish o'chiriladi va pastdagi media-query
     orqali tarkib bitta ustunga yig'iladi (aylantirish bilan).
  */
  #dashboard-viewport {
    width: 100%; height: 100%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    background: #F4F6F8;
  }
  #dashboard-canvas { width: 1920px; height: 1080px; flex: none; transform-origin: center center; }

  @media (max-width: 880px) {
    #dashboard-viewport { overflow-y: auto; align-items: flex-start; }
    #dashboard-canvas {
      width: 100% !important; height: auto !important; min-height: 100%;
      transform: none !important;
    }
    #dashboard-canvas > div { height: auto !important; }
    #dash-header { height: auto !important; flex-wrap: wrap; padding: 14px 16px !important; gap: 12px !important; }
    #dash-body { padding: 16px !important; overflow: visible !important; }
    #dash-main-grid { grid-template-columns: 1fr !important; overflow: visible !important; }
    #dash-main-grid > div { min-height: 320px; }
    #projects-grid { overflow-y: visible !important; }
    #projects-panel-header { flex-wrap: wrap; row-gap: 10px; padding: 16px !important; }
    #projects-panel-header > div:nth-child(3) { flex: 1 0 100% !important; }
    #today-feed { max-height: 320px; }
    #nshop-list { max-height: none !important; }
  }

  /* ── Loading ── */
  #loading-overlay {
    position: absolute; inset: 0; background: #F4F6F8; z-index: 50;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  }
  .spinner {
    width: 34px; height: 34px; border-radius: 99px;
    border: 3px solid rgba(47,122,185,.18); border-top-color: #2f7ab9;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-overlay .loading-text { font: 500 16px Sora, sans-serif; color: #6B7280; }

  /* ── Filtrlar ── */
  .filter-chip {
    height: 28px; padding: 0 12px; border-radius: 99px; border: 1px solid rgba(15,23,42,.12);
    background: #fff; font: 500 14px Sora, sans-serif; color: #4B5563; cursor: pointer;
    display: flex; align-items: center; gap: 7px; white-space: nowrap;
  }
  .filter-chip.active { border-color: transparent; background: #0f172a; color: #fff; }
  .filter-chip .dot { width: 8px; height: 8px; border-radius: 99px; flex: none; }

  /* ── Tabriklov modali ── */
  #celebrate-overlay {
    position: fixed; inset: 0; z-index: 100; display: none;
    align-items: center; justify-content: center;
    background: rgba(15,23,42,.35); overflow: hidden;
  }
  #celebrate-overlay.show { display: flex; }
  #celebrate-confetti { position: absolute; inset: 0; pointer-events: none; }
  .confetti-piece {
    position: absolute; top: -24px; width: 10px; height: 16px; opacity: .95;
    animation: confetti-fall linear forwards;
  }
  @keyframes confetti-fall {
    to { transform: translateY(110vh) rotate(600deg); opacity: .3; }
  }
  .celebrate-card {
    position: relative; z-index: 1; background: #fff; border-radius: 24px;
    padding: 44px 56px; text-align: center; box-shadow: 0 30px 70px rgba(15,23,42,.28);
    transform: scale(.85); opacity: 0; max-width: 90vw; box-sizing: border-box;
    animation: celebrate-in .45s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @media (max-width: 480px) {
    .celebrate-card { padding: 32px 26px; }
    .celebrate-name { font-size: 24px !important; }
  }
  .celebrate-card.leaving {
    animation: celebrate-out .35s ease forwards;
  }
  @keyframes celebrate-in { to { transform: scale(1); opacity: 1; } }
  @keyframes celebrate-out { to { transform: scale(.9) translateY(-14px); opacity: 0; } }
  .celebrate-emoji { font-size: 52px; line-height: 1; }
  .celebrate-avatar {
    width: 84px; height: 84px; border-radius: 99px; margin: 14px auto 0;
    background: linear-gradient(135deg,#2f7ab9,#5795C6); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font: 700 32px Sora, sans-serif; letter-spacing: -.02em;
  }
  .celebrate-name { font: 700 30px Sora, sans-serif; color: #0f172a; letter-spacing: -.02em; margin-top: 18px; }
  .celebrate-detail { font: 500 18px Sora, sans-serif; color: #6B7280; margin-top: 8px; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">ND</div>
    <div class="login-title">Devor ekrani</div>
    <div class="login-sub" id="login-sub">Telefon raqamingizni kiriting — Telegram botga tasdiqlash kodi yuboriladi.</div>

    <div id="phone-step">
      <label class="login-label" for="phone-input">Telefon raqam</label>
      <input class="login-input" id="phone-input" type="tel" placeholder="+998 90 123 45 67" autocomplete="tel">
      <button class="login-btn" id="request-code-btn">Kod yuborish</button>
    </div>

    <div id="code-step" style="display:none">
      <label class="login-label" for="code-input">Tasdiqlash kodi</label>
      <input class="login-input" id="code-input" type="text" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code" style="letter-spacing:.3em;text-align:center">
      <button class="login-btn" id="verify-code-btn">Tasdiqlash</button>
      <button class="login-btn secondary" id="resend-code-btn">Kodni qayta yuborish</button>
    </div>

    <div class="login-error" id="login-error"></div>
    <div class="login-hint">Faqat ro'yxatdan o'tgan xodimlar kira oladi.</div>
  </div>
</div>

<div id="dashboard-screen">
  <div id="loading-overlay"><div class="spinner"></div><div class="loading-text">Ma'lumotlar yuklanmoqda…</div></div>
  <div id="dashboard-viewport">
  <div id="dashboard-canvas" style="background:#F4F6F8;display:flex;flex-direction:column;overflow:hidden">

    <div id="dash-header" style="height:92px;background:#fff;border-bottom:1px solid rgba(15,23,42,.1);display:flex;align-items:center;padding:0 40px;gap:30px;flex:none">
      <div style="width:56px;height:56px;border-radius:16px;background:#2f7ab9;color:#fff;display:flex;align-items:center;justify-content:center;font:600 20px Sora,sans-serif;letter-spacing:-.01em">ND</div>
      <div>
        <div style="font:600 25px Sora,sans-serif;color:#0f172a;letter-spacing:-.02em">Nasaf Digital · Kontent paneli</div>
        <div id="cycle-label" style="font:400 16px Sora,sans-serif;color:#4B5563;margin-top:4px"></div>
      </div>
      <div style="flex:1"></div>
      <div style="display:flex;align-items:center;gap:26px">
        <div style="display:flex;align-items:center;gap:10px">
          <div style="width:9px;height:9px;border-radius:99px;background:#16a34a;animation:pulse 2.4s ease-in-out infinite"></div>
          <div id="updated-label" style="font:500 17px Sora,sans-serif;color:#6B7280"></div>
        </div>
        <div style="width:1px;height:38px;background:rgba(15,23,42,.12)"></div>
        <div style="text-align:right">
          <div id="clock" style="font:600 26px Sora,sans-serif;color:#0f172a;letter-spacing:-.02em;font-variant-numeric:tabular-nums"></div>
          <div id="clock-date" style="font:400 18px Sora,sans-serif;color:#6B7280;margin-top:3px"></div>
        </div>
      </div>
    </div>

    <div id="dash-body" style="flex:1;display:flex;flex-direction:column;gap:22px;padding:24px 40px 30px;overflow:hidden">
      <div id="dash-main-grid" style="flex:1;display:grid;grid-template-columns:1fr 460px;gap:22px;overflow:hidden">

        <div style="background:#fff;border:1px solid rgba(15,23,42,.09);border-radius:20px;display:flex;flex-direction:column;overflow:hidden">
          <div id="projects-panel-header" style="padding:20px 26px;border-bottom:1px solid rgba(15,23,42,.08);display:flex;align-items:center;gap:20px;flex:none">
            <div style="font:600 21px Sora,sans-serif;color:#0f172a;letter-spacing:-.02em">Loyihalar</div>
            <div id="projects-count-label" style="font:400 16px Sora,sans-serif;color:#9AA1AC"></div>
            <div style="flex:1"></div>
            <div id="project-status-filter" style="display:flex;align-items:center;gap:8px"></div>
          </div>
          <div id="projects-grid" style="flex:1;display:grid;grid-template-columns:1fr 1fr 1fr;grid-auto-rows:1fr;gap:16px;padding:18px;overflow-y:auto"></div>
        </div>

        <div style="display:flex;flex-direction:column;gap:22px;overflow:hidden">

          <div style="background:#0f172a;border-radius:20px;flex:1;display:flex;flex-direction:column;overflow:hidden">
            <div style="height:4px;background:rgba(255,255,255,.12);flex:none;overflow:hidden"><div style="height:100%;background:#5795C6;animation:tick 6s linear infinite"></div></div>
            <div style="padding:18px 24px 14px;display:flex;align-items:center;gap:12px;flex:none">
              <div style="width:10px;height:10px;border-radius:99px;background:#4ade80;animation:pulse 2.4s ease-in-out infinite;flex:none"></div>
              <div style="font:600 19px Sora,sans-serif;color:#fff;letter-spacing:-.01em">Bugun bajarilgan ishlar</div>
              <div style="flex:1"></div>
            </div>
            <div id="today-feed" style="flex:1;display:flex;flex-direction:column;padding:0 24px;overflow:hidden;min-height:0"></div>
            <div style="padding:16px 24px 18px;border-top:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:11px;flex:none;background:rgba(255,255,255,.04)">
              <div id="today-count-badge" style="font:600 34px/1 Sora,sans-serif;color:#fff;letter-spacing:-.03em;font-variant-numeric:tabular-nums"></div>
              <div style="font:400 17px Sora,sans-serif;color:rgba(255,255,255,.66)">vazifa bugun</div>
              <div style="width:1px;height:26px;background:rgba(255,255,255,.18)"></div>
              <div style="display:flex;align-items:baseline;gap:5px"><div id="today-post-count" style="font:600 19px Sora,sans-serif;color:#9cc3e3"></div><div style="font:400 16px Sora,sans-serif;color:rgba(255,255,255,.66)">post</div></div>
              <div style="display:flex;align-items:baseline;gap:5px"><div id="today-stories-count" style="font:600 19px Sora,sans-serif;color:#c4b5fd"></div><div style="font:400 16px Sora,sans-serif;color:rgba(255,255,255,.66)">stories</div></div>
              <div style="flex:1"></div>
              <div style="text-align:right">
                <div style="font:600 18px Sora,sans-serif;color:#fff"><span id="team-done">0</span><span id="team-target" style="font-weight:400;color:rgba(255,255,255,.6)"></span></div>
                <div id="month-label" style="font:400 15px Sora,sans-serif;color:rgba(255,255,255,.55);margin-top:2px"></div>
              </div>
            </div>
          </div>

          <div style="background:#fff;border:1px solid rgba(15,23,42,.09);border-radius:20px;padding:20px 24px 16px;flex:none;display:flex;flex-direction:column;overflow:hidden">
            <div style="display:flex;align-items:baseline;gap:12px;flex:none">
              <div style="font:600 18px Sora,sans-serif;color:#0f172a;letter-spacing:-.01em">NShop</div>
              <div id="nshop-total-label" style="font:400 16px Sora,sans-serif;color:#6B7280"></div>
              <div style="flex:1"></div>
              <div style="font:400 16px Sora,sans-serif;color:#6B7280">qoldiq</div>
            </div>
            <div id="nshop-list" style="flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;margin-top:4px"></div>
            <div style="padding-top:13px;border-top:1px solid rgba(15,23,42,.08);display:flex;align-items:center;gap:9px;flex:none">
              <div style="font:400 16px Sora,sans-serif;color:#6B7280">Bu oy almashtirildi</div>
              <div id="nshop-month-count" style="font:600 18px Sora,sans-serif;color:#0f172a"></div>
              <div style="flex:1"></div>
              <div id="nshop-month-spent" style="font:600 18px Sora,sans-serif;color:#d97706"></div>
              <div style="font:400 16px Sora,sans-serif;color:#6B7280">Ncoin</div>
            </div>
          </div>

        </div>

      </div>
    </div>
  </div>
  </div>
</div>

<div id="celebrate-overlay">
  <div id="celebrate-confetti"></div>
  <div class="celebrate-card" id="celebrate-card">
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-avatar" id="celebrate-avatar"></div>
    <div class="celebrate-name" id="celebrate-name"></div>
    <div class="celebrate-detail" id="celebrate-detail"></div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "wall_token";
  var REFRESH_MS = 60000;
  var CELEBRATE_POLL_MS = 6000;
  var CELEBRATE_SHOW_MS = 5000;
  var CELEBRATE_KIND_LABEL = { post: "Postni bajardi", stories: "Storiesni bajardi", task: "Vazifani bajardi", coin: "Mukofot oldi!" };
  var STATUS_COLOR = { ahead: "#16a34a", onTrack: "#2f7ab9", behind: "#d97706", debt: "#dc2626" };
  var STATUS_BG = { ahead: "#FAFDFB", onTrack: "#FBFCFE", behind: "#FEFBF6", debt: "#FFFAFA" };
  var STATUS_LABEL = { ahead: "Oldinda", onTrack: "Rejada", behind: "Ortda", debt: "Qarz" };
  var STATUS_ORDER = ["ahead", "onTrack", "behind", "debt"];
  var WEEKDAYS = ["Yakshanba","Dushanba","Seshanba","Chorshanba","Payshanba","Juma","Shanba"];
  var MONTHS = ["Yanvar","Fevral","Mart","Aprel","May","Iyun","Iyul","Avgust","Sentabr","Oktabr","Noyabr","Dekabr"];

  // Filtr holati — ma'lumot qayta so'ralmaydi, oxirgi kelgan `lastData`
  // shu holatga qarab qayta chiziladi (60s'lik avtomatik yangilanish
  // ham shu filtrlarni saqlab qoladi).
  var lastData = null;
  var projectStatusFilter = "all";
  var firstLoadDone = false;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  // ── Login ──
  var loginScreen = $("login-screen"), dashboardScreen = $("dashboard-screen");
  var phoneStep = $("phone-step"), codeStep = $("code-step");
  var phoneInput = $("phone-input"), codeInput = $("code-input");
  var loginError = $("login-error"), loginSub = $("login-sub");
  var requestBtn = $("request-code-btn"), verifyBtn = $("verify-code-btn"), resendBtn = $("resend-code-btn");
  var resendCooldownUntil = 0;

  function showError(msg) { loginError.textContent = msg || ""; }

  function apiFetch(url, opts) {
    opts = opts || {};
    var headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
    var token = localStorage.getItem(TOKEN_KEY);
    if (token) headers.Authorization = "Bearer " + token;
    return fetch(url, Object.assign({}, opts, { headers: headers }));
  }

  async function requestCode() {
    var phone = phoneInput.value.trim();
    if (!phone) return showError("Telefon raqamni kiriting");
    requestBtn.disabled = true;
    requestBtn.textContent = "Yuborilmoqda...";
    showError("");
    try {
      var res = await fetch("/api/auth/request-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Xatolik");
      phoneStep.style.display = "none";
      codeStep.style.display = "block";
      loginSub.textContent = "Telegram botingizga yuborilgan 6 xonali kodni kiriting.";
      codeInput.focus();
      startResendCooldown();
    } catch (e) {
      showError(e.message);
    }
    requestBtn.disabled = false;
    requestBtn.textContent = "Kod yuborish";
  }

  async function verifyCode() {
    var phone = phoneInput.value.trim();
    var code = codeInput.value.trim();
    if (!/^\d{6}$/.test(code)) return showError("6 xonali kodni kiriting");
    verifyBtn.disabled = true;
    verifyBtn.textContent = "Tekshirilmoqda...";
    showError("");
    try {
      var res = await fetch("/api/auth/verify-code", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone, code: code }),
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok) throw new Error(data.error || "Kod noto'g'ri");
      localStorage.setItem(TOKEN_KEY, data.token);
      enterDashboard();
    } catch (e) {
      showError(e.message);
    }
    verifyBtn.disabled = false;
    verifyBtn.textContent = "Tasdiqlash";
  }

  function startResendCooldown() {
    resendCooldownUntil = Date.now() + 60000;
    updateResendBtn();
  }
  function updateResendBtn() {
    var remaining = Math.ceil((resendCooldownUntil - Date.now()) / 1000);
    if (remaining > 0) {
      resendBtn.disabled = true;
      resendBtn.textContent = "Qayta yuborish (" + remaining + "s)";
      setTimeout(updateResendBtn, 1000);
    } else {
      resendBtn.disabled = false;
      resendBtn.textContent = "Kodni qayta yuborish";
    }
  }

  requestBtn.addEventListener("click", requestCode);
  verifyBtn.addEventListener("click", verifyCode);
  resendBtn.addEventListener("click", requestCode);
  phoneInput.addEventListener("keydown", function (e) { if (e.key === "Enter") requestCode(); });
  codeInput.addEventListener("keydown", function (e) { if (e.key === "Enter") verifyCode(); });

  function showLogin() {
    localStorage.removeItem(TOKEN_KEY);
    dashboardScreen.style.display = "none";
    loginScreen.style.display = "flex";
    phoneStep.style.display = "block";
    codeStep.style.display = "none";
    loginSub.textContent = "Telefon raqamingizni kiriting — Telegram botga tasdiqlash kodi yuboriladi.";
    codeInput.value = "";
    showError("");
    firstLoadDone = false;
    $("loading-overlay").style.display = "flex";
  }

  function enterDashboard() {
    loginScreen.style.display = "none";
    dashboardScreen.style.display = "block";
    fitCanvas();
    tickClock();
    setInterval(tickClock, 1000);
    loadStats();
    setInterval(loadStats, REFRESH_MS);
    initCelebrations();
    keepScreenAwake();
  }

  // ── Ekranni uyg'oq saqlash (devor displeyi doimiy yoqiq turishi kerak) ──
  // Asosiy himoya — brauzer standarti Wake Lock API. Bu televizor eski
  // qurilma bo'lgani uchun uni qo'llamasligi mumkin — shu sabab qo'shimcha
  // zaxira sifatida, ko'plab kiosk/signage tizimlarida ishlatiladigan
  // eski-uslub'dagi hiyla ham qo'llaniladi: ko'zga ko'rinmas, ovozsiz,
  // doim aylanadigan video oqim — ko'p qurilmalar "video ijro etilyapti"
  // holatini ekran skrinseyveri/o'chishi uchun "faol" deb hisoblaydi.
  // Diqqat: ba'zi eski webOS'larda TVning O'ZINING tizim skrinseyveri bu
  // ikkalasidan ham mustaqil ishlaydi — shu holatda faqat TV sozlamalari
  // (Settings → Energy Saving) orqali to'liq o'chirish mumkin.
  var wakeLock = null;
  var wakeVideoEl = null;
  var wakeDrawTimer = null;
  var wakeDebug = /[?&]wake-debug=1/.test(location.search);
  var wakeState = { lock: "—", video: "—" };

  // Diagnostika: ?wake-debug=1 bilan ochilsa, burchakda holat ko'rinadi.
  // Busiz Wake Lock berilgan-berilmaganini, video ijro bo'lgan-bo'lmaganini
  // umuman bilib bo'lmasdi — muammo qidirishda ko'r-ko'rona taxmin qilardik.
  function wakeLog(key, value) {
    wakeState[key] = value;
    console.log("[uyg'oq] " + key + ": " + value);
    if (!wakeDebug) return;
    var el = document.getElementById("wake-debug");
    if (!el) {
      el = document.createElement("div");
      el.id = "wake-debug";
      el.style.cssText =
        "position:fixed;left:8px;bottom:8px;z-index:9999;font:12px/1.5 monospace;" +
        "background:rgba(0,0,0,.78);color:#3ddc6b;padding:6px 10px;border-radius:6px;white-space:pre";
      document.body.appendChild(el);
    }
    el.textContent = "Wake Lock: " + wakeState.lock + "\nVideo: " + wakeState.video;
  }

  async function requestWakeLock() {
    if (!("wakeLock" in navigator)) {
      wakeLog("lock", "qo'llab-quvvatlanmaydi");
      return;
    }
    if (wakeLock) return;
    try {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLog("lock", "berildi");
      wakeLock.addEventListener("release", function () {
        wakeLock = null;
        wakeLog("lock", "bo'shadi");
      });
    } catch (e) {
      wakeLog("lock", "rad etildi — " + e.message);
    }
  }

  function keepScreenAwake() {
    requestWakeLock();
    startKeepAwakeVideo();
    // Qulf tizim hodisasi yoki fokus yo'qolishi sababli bo'shab ketishi
    // mumkin, va "release" hodisasi har doim ham kelavermaydi — shu sabab
    // uni davriy qayta so'raymiz. Arzon: qulf bor bo'lsa, so'rov umuman
    // yuborilmaydi (yuqoridagi `if (wakeLock) return`).
    setInterval(requestWakeLock, 30000);
    // Ba'zi platformalar media sessiyasi "playing" bo'lsa ham ekranni
    // uyg'oq tutadi — bu bepul qo'shimcha imkoniyat.
    try {
      if (navigator.mediaSession) navigator.mediaSession.playbackState = "playing";
    } catch (e) {}
  }

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState !== "visible") return;
    requestWakeLock();
    // Ekran qaytganda video ham to'xtagan bo'lishi mumkin.
    if (wakeVideoEl) wakeVideoEl.play().catch(function () {});
  });

  // ── Zaxira: HAQIQIY video ijrosi ──
  // Nega avvalgi canvas oqimi yetarli emasligi aniqlandi: quvvat
  // menejerlari "video ijro etilyapti" degan xulosaga dekoder ishlayotganiga
  // va kadrlar ko'rinadigan yuzaga chiqayotganiga qarab keladi. Jonli
  // captureStream() oqimi dekoderdan UMUMAN o'tmaydi, `opacity:0` va bir
  // piksel o'lcham esa uni "ko'rinmaydi" toifasiga tushiradi — ko'p
  // qurilmalar bunday ijroni hisobga olmaydi. Kino esa aynan shu uchtasi
  // bilan farq qiladi.
  //
  // Shuning uchun avval MediaRecorder orqali bir soniyalik HAQIQIY webm
  // yozib olamiz va uni loop qilib qo'yamiz — bu chinakam dekoderdan
  // o'tadi. MediaRecorder bo'lmasa (eski webOS) eski usul zaxira bo'lib
  // qoladi.
  //
  // Element ataylab `opacity:0` EMAS va `display:none` EMAS: to'liq
  // shaffof yoki chizilmaydigan elementni ba'zi platformalar ijro deb
  // hisoblamaydi. 8x8 piksel, deyarli shaffof — devor ekranida sezilmaydi.
  function makeWakeVideo(src, stream) {
    var v = document.createElement("video");
    if (stream) v.srcObject = stream;
    else v.src = src;
    v.loop = true;
    v.muted = true;
    v.defaultMuted = true;
    v.playsInline = true;
    v.setAttribute("muted", "");
    v.setAttribute("playsinline", "");
    v.setAttribute("aria-hidden", "true");
    v.style.cssText =
      "position:fixed;right:0;bottom:0;width:8px;height:8px;opacity:.02;pointer-events:none";
    document.body.appendChild(v);
    v.play().then(
      function () {
        wakeLog("video", stream ? "jonli oqim (zaxira)" : "yozilgan webm");
      },
      function (e) {
        wakeLog("video", "ijro bo'lmadi — " + e.message);
      },
    );
    return v;
  }

  function startKeepAwakeVideo() {
    if (wakeVideoEl) return;
    try {
      var canvas = document.createElement("canvas");
      canvas.width = 16;
      canvas.height = 16;
      var ctx = canvas.getContext("2d");
      var stream = canvas.captureStream ? canvas.captureStream(15) : null;
      if (!stream) {
        wakeLog("video", "captureStream yo'q");
        return;
      }
      // O'zgarmaydigan kanvasdan ba'zi brauzerlar umuman kadr chiqarmaydi —
      // shu sabab yozish davomida ranglarni almashtirib turamiz.
      var frame = 0;
      wakeDrawTimer = setInterval(function () {
        frame++;
        ctx.fillStyle = frame % 2 ? "#000000" : "#010101";
        ctx.fillRect(0, 0, 16, 16);
      }, 66);

      if (!window.MediaRecorder) {
        wakeVideoEl = makeWakeVideo(null, stream);
        return;
      }
      var chunks = [];
      var rec = new MediaRecorder(stream);
      rec.ondataavailable = function (e) {
        if (e.data && e.data.size) chunks.push(e.data);
      };
      rec.onstop = function () {
        var blob = null;
        try {
          blob = new Blob(chunks, { type: chunks[0] ? chunks[0].type : "video/webm" });
        } catch (e) {}
        if (blob && blob.size > 0) {
          // Yozilgan fayl bor — jonli oqim endi kerak emas, to'xtatamiz
          // (kanvas chizishi ham, oqim treklari ham bekorga ishlamasin).
          clearInterval(wakeDrawTimer);
          wakeDrawTimer = null;
          try {
            stream.getTracks().forEach(function (t) { t.stop(); });
          } catch (e) {}
          wakeVideoEl = makeWakeVideo(URL.createObjectURL(blob), null);
        } else {
          wakeVideoEl = makeWakeVideo(null, stream);
        }
      };
      rec.start();
      setTimeout(function () {
        try { rec.stop(); } catch (e) {}
      }, 1000);
    } catch (e) {
      wakeLog("video", "xato — " + e.message);
    }
  }

  // ── Moslashuvchan kanvas ──
  // 1920x1080 dizayn "kanvasi"ni ekran o'lchamiga qarab kichraytirib/
  // kattalashtirib, aynan o'zgarishsiz moslaydi (turli monitor/noutbuk
  // o'lchamlari uchun). MOBILE_BREAKPOINT'dan tor ekranlarda o'chadi —
  // aks holda matn o'qib bo'lmas darajada mayda bo'lib qolardi; o'rniga
  // CSS media-query orqali tarkib bitta ustunga yig'iladi.
  var MOBILE_BREAKPOINT = 880;
  function isMobileLayout() { return window.innerWidth <= MOBILE_BREAKPOINT; }
  function fitCanvas() {
    var canvas = $("dashboard-canvas");
    if (isMobileLayout()) {
      canvas.style.transform = "none";
      return;
    }
    var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    canvas.style.transform = "scale(" + scale + ")";
  }
  window.addEventListener("resize", function () {
    fitCanvas();
    if (lastData) renderProjects(lastData.projects);
  });

  // ── Clock ──
  // Televizor/qurilmaning o'z sistema soat mintaqasidan MUSTAQIL —
  // O'zbekiston doim UTC+5 (DST yo'q), shu sabab eng ishonchli yo'l
  // Intl/timeZone'ga (eski qurilmalarda to'liq qo'llab-quvvatlanmasligi
  // mumkin) tayanmasdan, UTC vaqtiga qo'lda +5 soat qo'shib UTC
  // getter'lari bilan o'qish.
  var lastUpdatedAt = null;
  function tashkentNow() {
    return new Date(Date.now() + 5 * 3600 * 1000);
  }
  function tickClock() {
    var now = tashkentNow();
    $("clock").textContent = pad2(now.getUTCHours()) + ":" + pad2(now.getUTCMinutes());
    $("clock-date").textContent = WEEKDAYS[now.getUTCDay()] + ", " + now.getUTCDate() + "-" + MONTHS[now.getUTCMonth()].toLowerCase();
    if (lastUpdatedAt) {
      var mins = Math.max(0, Math.round((Date.now() - lastUpdatedAt) / 60000));
      $("updated-label").textContent = mins === 0 ? "Hozirgina yangilandi" : mins + " daqiqa oldin yangilandi";
    }
  }
  function pad2(n) { return String(n).padStart(2, "0"); }

  // ── Stats render ──
  async function loadStats() {
    try {
      var res = await apiFetch("/api/stats");
      if (res.status === 401) return showLogin();
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || "Xatolik");
      lastUpdatedAt = Date.now();
      lastData = data;
      render(data);
      if (!firstLoadDone) {
        firstLoadDone = true;
        $("loading-overlay").style.display = "none";
      }
    } catch (e) {
      console.error("Stats yuklashda xatolik:", e);
    }
  }

  function render(data) {
    $("cycle-label").textContent = data.cycleLabel || "";

    renderProjectStatusFilter(data.projects);
    renderProjects(data.projects);

    startFeedRotation(data.todayFeed);
    var now = tashkentNow();
    $("today-count-badge").textContent = data.summary.todayDoneCount;
    $("today-post-count").textContent = data.summary.todayPostCount;
    $("today-stories-count").textContent = data.summary.todayStoriesCount;
    $("team-done").textContent = data.summary.teamDoneCount;
    $("team-target").textContent = "/" + data.summary.teamTargetCount;
    $("month-label").textContent = MONTHS[now.getUTCMonth()].toLowerCase() + "da";

    renderNShop(data.nshop);
  }

  function renderNShop(nshop) {
    if (!nshop) return;
    $("nshop-total-label").textContent = "omborda " + nshop.totalStock + " ta";
    $("nshop-list").innerHTML = nshop.products.length
      ? nshop.products.map(nshopRowHtml).join("")
      : '<div style="color:#9AA1AC;font:500 15px Sora,sans-serif;text-align:center">Mahsulot yo\'q</div>';
    $("nshop-month-count").textContent = nshop.monthPurchaseCount + " ta";
    $("nshop-month-spent").textContent = fmtNcoin(nshop.monthNcoinSpent);
  }

  function fmtNcoin(n) {
    n = Number(n) || 0;
    return (Number.isInteger(n) ? n : n.toFixed(1)).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  }

  function nshopRowHtml(item) {
    var barColor = item.pct < 75 ? "#d97706" : "#2f7ab9";
    return (
      '<div class="nshop-row" style="display:flex;align-items:center;gap:13px;padding:15px 0">' +
      '<div style="flex:1;min-width:0"><div style="font:500 17px Sora,sans-serif;color:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(item.name) + '</div>' +
      '<div style="margin-top:7px;height:7px;border-radius:99px;background:#E7EBEF;overflow:hidden"><div style="width:' + Math.max(0, Math.min(100, item.pct)) + '%;height:100%;background:' + barColor + ';border-radius:99px"></div></div></div>' +
      '<div style="text-align:right;flex:none;width:96px">' +
      '<div style="display:flex;align-items:baseline;gap:5px;justify-content:flex-end"><div style="font:600 21px Sora,sans-serif;color:#0f172a;letter-spacing:-.01em;font-variant-numeric:tabular-nums">' + item.stock + '</div><div style="font:400 15px Sora,sans-serif;color:#6B7280">ta qoldi</div></div>' +
      '<div style="font:400 16px Sora,sans-serif;color:#6B7280;margin-top:3px">' + item.purchasedThisMonth + ' ta olindi</div>' +
      '</div></div>'
    );
  }

  // ── Loyihalar: holat bo'yicha filtr ──
  // Chiplar "Loyihalar" panelidagi eski statik rang-legendasi o'rnida —
  // endi bosilganda o'sha holatdagi loyihalarnigina ko'rsatadi (ma'lumot
  // qayta so'ralmaydi, lastData'dan qayta chiziladi).
  function renderProjectStatusFilter(projects) {
    var counts = {};
    projects.forEach(function (p) { counts[p.status] = (counts[p.status] || 0) + 1; });
    var chips = ['<button type="button" class="filter-chip' + (projectStatusFilter === "all" ? " active" : "") + '" data-status="all">Hammasi · ' + projects.length + "</button>"];
    STATUS_ORDER.forEach(function (status) {
      if (!counts[status]) return;
      chips.push(
        '<button type="button" class="filter-chip' + (projectStatusFilter === status ? " active" : "") + '" data-status="' + status + '">' +
        '<span class="dot" style="background:' + (projectStatusFilter === status ? "#fff" : STATUS_COLOR[status]) + '"></span>' +
        STATUS_LABEL[status] + " · " + counts[status] +
        "</button>",
      );
    });
    var el = $("project-status-filter");
    el.innerHTML = chips.join("");
    Array.prototype.forEach.call(el.querySelectorAll(".filter-chip"), function (btn) {
      btn.addEventListener("click", function () {
        projectStatusFilter = btn.dataset.status;
        if (lastData) {
          renderProjectStatusFilter(lastData.projects);
          renderProjects(lastData.projects);
        }
      });
    });
  }

  function renderProjects(projects) {
    var filtered = projectStatusFilter === "all" ? projects : projects.filter(function (p) { return p.status === projectStatusFilter; });
    $("projects-count-label").textContent = projects.length + " faol · tempo bo'yicha";
    // Ustunlar soni loyihalar soniga qarab moslashadi (dizayn 6 taga
    // mo'ljallangan edi, lekin bu sonlar vaqt o'tishi bilan o'zgaradi —
    // qattiq 3 ustun qolsa, 6 tadan ko'p loyiha pastki qatorda kesilib
    // qolardi).
    var projectCols = isMobileLayout() ? 1 : filtered.length > 6 ? 4 : 3;
    $("projects-grid").style.gridTemplateColumns = "repeat(" + Math.max(1, Math.min(projectCols, filtered.length)) + ", 1fr)";
    $("projects-grid").innerHTML = filtered.length
      ? filtered.map(projectCardHtml).join("")
      : '<div style="grid-column:1/-1;display:flex;align-items:center;justify-content:center;color:#9AA1AC;font:500 15px Sora,sans-serif">Bu holatda loyiha yoʻq</div>';
  }

  function projectCardHtml(p) {
    var color = STATUS_COLOR[p.status], bg = STATUS_BG[p.status];
    var borderOpacity = p.status === "debt" ? "" : "34";
    var border = p.status === "debt" ? "1.5px solid " + color : "1px solid " + color + borderOpacity;
    var pctColor = p.status === "debt" ? color : "#0f172a";
    return (
      '<div style="border:' + border + ';background:' + bg + ';border-radius:16px;padding:18px 19px;display:flex;flex-direction:column">' +
      '<div style="display:flex;align-items:center;gap:10px">' +
      '<div style="height:26px;padding:0 10px;border-radius:7px;background:' + color + ';color:#fff;font:600 14px Sora,sans-serif;display:flex;align-items:center">' + esc(p.statusLabel) + '</div>' +
      '<div style="flex:1"></div>' +
      '<div style="font:500 17px Sora,sans-serif;color:' + (p.status === "debt" ? color : "#4B5563") + '">' + esc(p.daysLabel) + '</div>' +
      '</div>' +
      '<div style="font:600 27px Sora,sans-serif;color:#0f172a;letter-spacing:-.025em;margin-top:13px">' + esc(p.label) + '</div>' +
      '<div style="display:flex;align-items:center;gap:9px;margin-top:9px">' +
      (p.contributor
        ? '<div style="width:28px;height:28px;border-radius:9px;background:#EDEFF2;display:flex;align-items:center;justify-content:center;font:600 12px Sora,sans-serif;color:#0f172a;flex:none">' + esc(p.contributor.slice(0, 1)) + '</div><div style="font:400 17px Sora,sans-serif;color:#4B5563">' + esc(p.contributor) + '</div>'
        : '') +
      '<div style="flex:1"></div>' +
      '<div style="display:flex;align-items:center;gap:8px">' +
      '<div style="display:flex;align-items:baseline;gap:4px"><div style="font:600 17px Sora,sans-serif;color:#0f172a;letter-spacing:-.01em">' + p.doneK + '</div><div style="font:400 13px Sora,sans-serif;color:#6B7280">post</div></div>' +
      '<div style="width:1px;height:14px;background:rgba(15,23,42,.16)"></div>' +
      '<div style="display:flex;align-items:baseline;gap:4px"><div style="font:600 17px Sora,sans-serif;color:#0f172a;letter-spacing:-.01em">' + p.doneS + '</div><div style="font:400 13px Sora,sans-serif;color:#6B7280">stories</div></div>' +
      '</div></div>' +
      '<div style="flex:1"></div>' +
      '<div style="display:flex;align-items:flex-end;gap:11px"><div style="font:600 44px/1 Sora,sans-serif;color:' + pctColor + ';letter-spacing:-.03em;font-variant-numeric:tabular-nums">' + p.donePct + '<span style="font-size:24px">%</span></div><div style="font:500 19px Sora,sans-serif;color:#4B5563;padding-bottom:5px;font-variant-numeric:tabular-nums">' + p.doneCount + '/' + p.targetCount + '</div></div>' +
      '<div style="margin-top:12px;height:11px;border-radius:99px;background:' + (p.status === "debt" ? "#F3DDDD" : "#E7EBEF") + ';position:relative;overflow:hidden">' +
      '<div style="position:absolute;left:0;top:0;bottom:0;width:' + Math.min(100, p.donePct) + '%;background:' + color + ';border-radius:99px"></div>' +
      (p.status !== "debt" && p.expectedPct != null ? '<div style="position:absolute;left:' + p.expectedPct + '%;top:-4px;bottom:-4px;width:3px;background:#0f172a;border-radius:2px"></div>' : "") +
      '</div>' +
      '<div style="font:' + (p.status === "debt" ? "600" : "500") + ' 17px Sora,sans-serif;color:' + (p.status === "ahead" ? "#15803d" : p.status === "behind" ? "#a45f08" : p.status === "debt" ? color : "#374151") + ';margin-top:9px">' + esc(p.deltaText) + '</div>' +
      '</div>'
    );
  }

  function feedRowHtml(f) {
    var title = f.label + (f.detail ? " · " + f.detail : "");
    return (
      '<div class="feed-row" style="flex:0 0 auto;padding:14px 0;display:flex;align-items:center;gap:14px">' +
      '<div style="width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;font:600 16px Sora,sans-serif;color:#fff;flex:none">' + esc(f.avatar) + '</div>' +
      '<div style="flex:1;min-width:0"><div style="font:600 19px Sora,sans-serif;color:#fff;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(title) + '</div><div style="font:400 16px Sora,sans-serif;color:rgba(255,255,255,.66);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(f.name) + ' · ' + esc(f.projectLabel) + '</div></div>' +
      '<div style="font:500 16px Sora,sans-serif;color:rgba(255,255,255,.7);flex:none;font-variant-numeric:tabular-nums">' + esc(f.time) + '</div>' +
      '</div>'
    );
  }

  // ── "Bugun bajarilgan ishlar" — avtomatik sahifalab aylantirish ──
  // Kartaning tepasidagi ingichka chiziqcha (@keyframes tick, 6s) —
  // vaqt o'tishini ko'rsatuvchi indikator: har 6 soniyada ro'yxatning
  // KEYINGI sahifasi ko'rsatiladi (barchasi ekranga sig'masa). Bitta
  // sahifaga nechta qator sig'ishi konteyner balandligidan avtomatik
  // hisoblanadi (ekran o'lchamidan qat'i nazar to'g'ri ishlashi uchun).
  var FEED_ROTATE_MS = 6000;
  var feedItemsCache = [];
  var feedPageIndex = 0;
  var feedRotateTimer = null;
  var feedRowHeightCache = null;

  function startFeedRotation(items) {
    feedItemsCache = items || [];
    feedPageIndex = 0;
    feedRowHeightCache = null;
    renderFeedPage();
    if (feedRotateTimer) clearInterval(feedRotateTimer);
    feedRotateTimer = setInterval(function () {
      feedPageIndex++;
      renderFeedPage();
    }, FEED_ROTATE_MS);
  }

  function feedPageSize(container) {
    if (!feedRowHeightCache && feedItemsCache.length) {
      var probe = document.createElement("div");
      probe.style.cssText = "position:absolute;visibility:hidden;pointer-events:none";
      probe.innerHTML = feedRowHtml(feedItemsCache[0]);
      container.appendChild(probe);
      feedRowHeightCache = probe.firstChild.offsetHeight || 70;
      container.removeChild(probe);
    }
    return Math.max(1, Math.floor(container.clientHeight / (feedRowHeightCache || 70)));
  }

  function renderFeedPage() {
    var container = $("today-feed");
    if (!container) return;
    if (!feedItemsCache.length) {
      container.innerHTML = '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font:500 15px Sora,sans-serif">Bugun hali hech narsa yo\'q</div>';
      return;
    }
    var pageSize = feedPageSize(container);
    var totalPages = Math.max(1, Math.ceil(feedItemsCache.length / pageSize));
    feedPageIndex = ((feedPageIndex % totalPages) + totalPages) % totalPages;
    var start = feedPageIndex * pageSize;
    container.innerHTML = feedItemsCache.slice(start, start + pageSize).map(feedRowHtml).join("");
  }

  // ── Tabriklov ("qarsak") modali ──
  // Post/Stories yoki xodimga biriktirilgan vazifa bajarilganda, butun
  // jamoa ko'rib turgan devor ekranida 5 soniyaga xodim ismini
  // ko'rsatib tabriklaydi. Real-time push (WebSocket/SSE) o'rniga —
  // Vercel serverless funksiyalarida uzoq muddatli ulanish yo'q — bu
  // yengil /api/celebrations endpointini tez-tez (6s) so'rash orqali
  // qilingan; asosiy /api/stats bilan aralashtirilmagan, chunki u
  // og'irroq va faqat 60s'da bir marta kerak.
  var celebrateSince = null;
  var celebrateQueue = [];
  var celebrateShowing = false;
  var audioCtx = null;

  function unlockAudio() {
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { /* brauzer qo'llamasa — ovozsiz davom etadi */ }
  }
  document.addEventListener("click", unlockAudio, { once: true });

  // Qarsak ovozini haqiqiy audio fayl ulamasdan, Web Audio API orqali
  // "sintez" qiladi — bir nechta qisqa oq-shovqin portlashlari orqali
  // qarsak taqillashiga o'xshatilgan (tashqi audio fayl/CDN kerak emas).
  // Bitta "qarsak" — juda qisqa oq-shovqin, EKSPONENSIAL pasayish bilan
  // (avvalgi versiyada kvadratik-chiziqli so'nish edi — bu asta so'nib,
  // xirillagan "shovqin" kabi eshitilardi; haqiqiy qarsak esa deyarli
  // bir zumda portlab, keskin so'nadi). Ikki filtr qatlamiga bo'linadi:
  // yuqori chastotali "chaqilish" (bandpass) + past-o'rta "tana"
  // (lowpass) — shu ikkisi birga to'liqroq, real qarsakka yaqinroq
  // tovush beradi (faqat bandpass — ingichka, hissli tovush berardi).
  function scheduleClap(t) {
    var dur = 0.018 + Math.random() * 0.022;
    var buffer = audioCtx.createBuffer(1, Math.max(1, Math.floor(audioCtx.sampleRate * dur)), audioCtx.sampleRate);
    var data = buffer.getChannelData(0);
    for (var j = 0; j < data.length; j++) {
      var decay = Math.exp(-(j / data.length) * 38);
      data[j] = (Math.random() * 2 - 1) * decay;
    }
    var src = audioCtx.createBufferSource();
    src.buffer = buffer;

    var crack = audioCtx.createBiquadFilter();
    crack.type = "bandpass";
    crack.frequency.value = 2200 + Math.random() * 3500;
    crack.Q.value = 0.6;

    var body = audioCtx.createBiquadFilter();
    body.type = "lowpass";
    body.frequency.value = 700 + Math.random() * 500;

    var gain = audioCtx.createGain();
    var peak = 0.28 + Math.random() * 0.22;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(peak, t + 0.002);
    gain.gain.linearRampToValueAtTime(0, t + dur + 0.03);

    src.connect(crack).connect(gain);
    src.connect(body).connect(gain);

    if (typeof audioCtx.createStereoPanner === "function") {
      var panner = audioCtx.createStereoPanner();
      panner.pan.value = Math.max(-1, Math.min(1, (Math.random() * 2 - 1) * 0.85));
      gain.connect(panner).connect(audioCtx.destination);
    } else {
      gain.connect(audioCtx.destination);
    }
    src.start(t);
  }

  // Butun "qarsaklar ovozi" — boshida bir zumlik zich zarba (qo'llar
  // birdan "portlab" ketgandek), so'ng 1.6 soniya davomida asta
  // siyraklashib boruvchi taqillash bilan davom etadi (Math.random()'ni
  // daraja bilan qiyshaytirish orqali — kichik qiymatlar, ya'ni ertaroq
  // vaqtlar, ko'proq chiqadi).
  function playApplause() {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === "suspended") audioCtx.resume();
      var now = audioCtx.currentTime;
      for (var i = 0; i < 14; i++) scheduleClap(now + Math.random() * 0.12);
      var hits = 42;
      for (var k = 0; k < hits; k++) {
        var progress = Math.pow(Math.random(), 1.7);
        scheduleClap(now + 0.05 + progress * 1.6);
      }
    } catch (e) { /* ovoz muvaffaqiyatsiz bo'lsa ham vizual tabrik davom etadi */ }
  }

  var CONFETTI_COLORS = ["#2f7ab9", "#16a34a", "#d97706", "#dc2626", "#5795C6", "#facc15"];
  function spawnConfetti() {
    var host = $("celebrate-confetti");
    host.innerHTML = "";
    for (var i = 0; i < 50; i++) {
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      piece.style.left = Math.random() * 100 + "%";
      piece.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
      piece.style.animationDuration = 1.6 + Math.random() * 1.4 + "s";
      piece.style.animationDelay = Math.random() * 0.4 + "s";
      host.appendChild(piece);
    }
  }

  function celebrateHtml(ev) {
    return {
      name: ev.name,
      avatar: initialsOf(ev.name),
      detail: (CELEBRATE_KIND_LABEL[ev.kind] || "Bajardi") + (ev.detail ? " · " + ev.detail : ""),
    };
  }
  function initialsOf(name) { return (name || "?").trim().slice(0, 1).toUpperCase(); }

  function processCelebrateQueue() {
    if (celebrateShowing || celebrateQueue.length === 0) return;
    celebrateShowing = true;
    var ev = celebrateQueue.shift();
    var view = celebrateHtml(ev);
    $("celebrate-avatar").textContent = view.avatar;
    $("celebrate-name").textContent = view.name;
    $("celebrate-detail").textContent = view.detail;
    var card = $("celebrate-card");
    card.classList.remove("leaving");
    spawnConfetti();
    playApplause();
    $("celebrate-overlay").classList.add("show");
    setTimeout(function () {
      card.classList.add("leaving");
      setTimeout(function () {
        $("celebrate-overlay").classList.remove("show");
        $("celebrate-confetti").innerHTML = "";
        celebrateShowing = false;
        processCelebrateQueue();
      }, 350);
    }, CELEBRATE_SHOW_MS);
  }

  async function pollCelebrations() {
    try {
      var res = await apiFetch("/api/celebrations?since=" + encodeURIComponent(celebrateSince));
      if (!res.ok) return;
      var data = await res.json();
      celebrateSince = data.now || new Date().toISOString();
      (data.events || []).forEach(function (ev) { celebrateQueue.push(ev); });
      processCelebrateQueue();
    } catch (e) {
      console.error("Celebrations so'rovida xatolik:", e);
    }
  }

  function initCelebrations() {
    celebrateSince = new Date().toISOString();
    setInterval(pollCelebrations, CELEBRATE_POLL_MS);
  }

  // ── Boot ──
  if (localStorage.getItem(TOKEN_KEY)) {
    enterDashboard();
  } else {
    showLogin();
  }
})();
</script>
